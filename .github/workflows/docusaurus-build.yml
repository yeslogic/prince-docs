
name: Build and deploy the Prince documentation site
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Install xsltproc
        run: |
          sudo apt-get update
          sudo apt-get install -y xsltproc
      - name: Make the properties
        run: |
          cd ./src/properties
          chmod +x ./docs-process.py
          chmod +x ./docs_selflink.py
          make
          make clean
          cd ./../..
        shell: bash
      - name: Install jq
        run: |
          sudo apt-get install jq
      - name: Make _std-data.json for js-support page
        run: |
          cd ./src/js-support
          make
          make clean
          cd ./../..
        shell: bash
      - name: Install Prince
        run: |
          curl https://www.princexml.com/download/prince_17-1_ubuntu26.04_amd64.deb -O
          sudo apt install ./prince_17-1_ubuntu26.04_amd64.deb
      - name: Install ImageMagick
        run: |
          sudo apt install imagemagick
      - name: Make the page region image
        run: |
          cd ./src/samples
          make
          make clean
          cd ./../..
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Build Docusaurus Docs
        run: |
          npm install 
          npm run build
      - name: Prepare deployment
        run: |
          cd ./build
          rm -rf ./blog
          cd ./..
          # Stage the legacy redirect pages (/doc-install, /doc-prince,
          # /doc-refs) which are deployed to the web root, one level above
          # the docs, so that pre-Docusaurus URLs keep redirecting.
          mkdir rootpages
          cp -r ./build/doc-install ./build/doc-prince ./build/doc-refs ./rootpages/
      - name: Deploy
        uses: nogsantos/ssh-scp-deploy@master
        with:
          src: ./build/*
          host: ${{ secrets.SSH_HOST }}
          remote: ${{ secrets.SSH_DIR }}
          port: ${{ secrets.SSH_PORT }}
          user: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
      - name: Deploy legacy redirect pages to the web root
        uses: nogsantos/ssh-scp-deploy@master
        with:
          src: ./rootpages/*
          host: ${{ secrets.SSH_HOST }}
          remote: ${{ secrets.SSH_DIR }}/..
          port: ${{ secrets.SSH_PORT }}
          user: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
